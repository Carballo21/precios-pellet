# =====================================================================
#  PUNTOS DE VENTA VIGILADOS
# ---------------------------------------------------------------------
#  Cada entrada es una página de producto con precio público.
#
#  tipo:        destino = precio a consumidor (tienda / distribuidor)
#               origen  = venta directa de fábrica (proxy del precio en origen)
#  formato:     saco | palet | bigbag | granel
#  kg:          kilos que cubre el precio mostrado (saco 15, palet 70 sacos = 1050...)
#  iva_incluido: si el precio de la web lleva IVA (si la web lo declara en sus
#               datos estructurados, se usa lo que diga la web)
#  transporte:  incluido | aparte | recogida | desconocido
#  metodo:      auto (recomendado) | css | regex
#               auto prueba: datos estructurados JSON-LD, microdatos, metaetiquetas,
#               API de Shopify y, en último lugar, el texto de la página.
#  selector:    (opcional) selector CSS del precio si auto falla
#  regex:       (opcional) expresión regular con un grupo que capture el precio
#  playwright:  true para webs que solo muestran el precio con JavaScript
#  verificar:   true = revisar a mano la primera vez (formato o kg dudosos)
#
#  Para AÑADIR un punto: copia un bloque, cambia id, url y datos. Para
#  QUITARLO sin borrarlo: activo: false
# =====================================================================

